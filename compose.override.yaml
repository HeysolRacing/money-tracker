# Development overrides (loaded automatically by `docker compose up`):
# hot reload for api and web, source bind-mounted, extra ports on localhost.
services:
  db:
    ports:
      - "127.0.0.1:5432:5432"

  api:
    # Separate tag so the dev image (with test tools) is not overwritten by prod builds.
    image: moneytracker-api:dev
    build:
      target: dev
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      TEST_DATABASE_URL: postgresql+asyncpg://moneytracker:${POSTGRES_PASSWORD}@db:5432/moneytracker_test
      # File change events don't cross the Windows -> Docker bind mount; poll instead.
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./backend:/app
    ports:
      - "127.0.0.1:8000:8000"

  web:
    build: !reset null
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
      VITE_USE_POLLING: "true"
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
    ports: !override
      - "127.0.0.1:5173:5173"

volumes:
  web_node_modules:
